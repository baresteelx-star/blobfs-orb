<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BlobFS 2D</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; background: #0d1117; color: #e6edf3; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; cursor: grab; }
  canvas:active { cursor: grabbing; }
  #panel { position: absolute; top: 12px; right: 12px; width: 280px; background: rgba(22,27,34,0.95); border: 1px solid #30363d; border-radius: 8px; padding: 14px; font-size: 13px; max-height: calc(100vh - 24px); overflow-y: auto; z-index: 2; }
  #panel h2 { font-size: 15px; margin-bottom: 10px; color: #58a6ff; }
  .row { display: flex; gap: 6px; margin-bottom: 8px; flex-wrap: wrap; }
  button { background: #21262d; border: 1px solid #30363d; color: #e6edf3; border-radius: 6px; padding: 5px 10px; cursor: pointer; font-size: 12px; }
  button.primary { background: #1f6feb; border-color: #1f6feb; }
  .blob-row { padding: 6px 8px; border-radius: 6px; margin-bottom: 4px; cursor: pointer; border: 1px solid transparent; }
  .blob-row.selected { border-color: #58a6ff; }
  .meta { color: #8b949e; font-size: 11px; }
  .pending { background: rgba(210,153,34,0.15); border: 1px solid #d29922; border-radius: 6px; padding: 8px; margin-bottom: 8px; }
  .hint { color: #8b949e; font-size: 11px; margin-top: 8px; line-height: 1.4; }
  #status { position: absolute; bottom: 12px; left: 12px; background: rgba(22,27,34,0.9); border: 1px solid #30363d; border-radius: 6px; padding: 6px 10px; font-size: 12px; color: #8b949e; z-index: 2; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="panel">
  <h2>BlobFS 2D</h2>
  <div class="row">
    <button class="primary" id="btnNew">New blob</button>
    <button id="btnSplit">Split selected</button>
    <button id="btnSave">Save .orb</button>
  </div>
  <div id="pendingList"></div>
  <div id="blobList"></div>
  <div class="hint">Drag one circle onto another and release to merge. Amber means a suggestion. Same kind merges on release. Different kinds need a shared tag and Accept.</div>
</div>
<div id="status">loading</div>
<script>
(function () {
  var BODY = 1024 * 1024;
  var nextId = 1;
  var blobs = {};
  var proposals = {};
  var selected = null;
  var dragging = null;
  var dragPos = null;

  function addBlob(kind, name, mass, tags) {
    var id = 'b' + (nextId++);
    blobs[id] = { id: id, kind: kind, name: name, mass: mass, tags: tags.slice(), children: [], parent: null, alive: true, x: 0, y: 0 };
    return id;
  }
  function addFile(name, bytes, tags) { return addBlob('file', name, BODY + bytes, tags); }
  function addDir(name, tags) { return addBlob('dir', name, BODY, tags); }

  var covers = addDir('Covers', ['music']);
  var sessions = addDir('Sessions', ['music', '2024']);
  var masters = addDir('Masters', ['music']);
  var photo1 = addFile('photo1.jpg', 2700000, ['vacation', '2024']);
  var photo2 = addFile('photo2.jpg', 2800000, ['vacation', '2024']);
  var song1 = addFile('song1.wav', 800000, ['berlin-set', 'demo']);
  var notes = addFile('notes.txt', 12000, ['work']);
  var order = [covers, sessions, masters, photo1, photo2, song1, notes];

  function layout() {
    var w = window.innerWidth;
    var h = window.innerHeight;
    var pad = 80;
    var cols = 4;
    var i, id, col, row;
    for (i = 0; i < order.length; i++) {
      id = order[i];
      if (!blobs[id] || !blobs[id].alive) continue;
      col = i % cols;
      row = Math.floor(i / cols);
      blobs[id].x = pad + col * ((w - 320) / cols);
      blobs[id].y = pad + 40 + row * 180;
      if (blobs[id].x < 40) blobs[id].x = 40;
      if (blobs[id].y < 40) blobs[id].y = 40;
    }
  }

  function radius(mass) { return Math.max(22, Math.cbrt(mass / BODY) * 24); }

  var canvas = document.getElementById('stage');
  var ctx = canvas.getContext('2d');
  var statusEl = document.getElementById('status');

  function setStatus(t) { statusEl.textContent = t; }

  function pendingFor(id) {
    var pid, pr;
    for (pid in proposals) {
      pr = proposals[pid];
      if (pr.status === 'pending' && (pr.a === id || pr.b === id)) return true;
    }
    return false;
  }

  function draw() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    var id, b, r, count = 0;
    for (id in blobs) {
      b = blobs[id];
      if (!b.alive) continue;
      count++;
      r = radius(b.mass);
      ctx.beginPath();
      ctx.arc(b.x, b.y, r, 0, Math.PI * 2);
      if (id === selected) {
        ctx.fillStyle = '#1c2128';
        ctx.fill();
        ctx.strokeStyle = '#58a6ff';
        ctx.lineWidth = 2;
        ctx.stroke();
      } else if (pendingFor(id)) {
        ctx.fillStyle = 'rgba(210,153,34,0.25)';
        ctx.fill();
        ctx.strokeStyle = '#d29922';
        ctx.lineWidth = 2;
        ctx.stroke();
      } else {
        ctx.fillStyle = b.kind === 'dir' ? '#21262d' : '#161b22';
        ctx.fill();
        ctx.strokeStyle = '#8b949e';
        ctx.lineWidth = 1.5;
        ctx.stroke();
      }
      ctx.fillStyle = '#e6edf3';
      ctx.font = '12px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(b.name, b.x, b.y + 4);
    }
    if (dragging && dragPos) {
      b = blobs[dragging];
      r = radius(b.mass);
      ctx.beginPath();
      ctx.arc(dragPos.x, dragPos.y, r, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(88,166,255,0.35)';
      ctx.fill();
      ctx.strokeStyle = '#58a6ff';
      ctx.stroke();
    }
    if (count === 0) {
      ctx.fillStyle = '#8b949e';
      ctx.font = '16px sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText('No orbs loaded', 24, 40);
    }
  }

  function sharedTags(a, b) {
    var out = [], i;
    for (i = 0; i < a.tags.length; i++) if (b.tags.indexOf(a.tags[i]) >= 0) out.push(a.tags[i]);
    return out;
  }

  function propose(a, b) {
    var sa = blobs[a], sb = blobs[b], shared, pid;
    if (!sa || !sb || !sa.alive || !sb.alive) return;
    if (sa.parent || sb.parent) return;
    shared = sharedTags(sa, sb);
    if (sa.kind !== sb.kind && shared.length === 0) return;
    pid = 'p' + nextId++;
    proposals[pid] = { pid: pid, a: a, b: b, status: 'pending', shared: shared };
  }

  function commit(pid) {
    var pr = proposals[pid];
    var sa, sb, parent, child, other;
    if (!pr || pr.status !== 'pending') return;
    sa = blobs[pr.a]; sb = blobs[pr.b];
    if (!sa.alive || !sb.alive) { pr.status = 'stale'; return; }
    if (sa.kind === 'dir' && sb.kind === 'dir') {
      parent = sa.mass >= sb.mass ? sa : sb;
      child = parent === sa ? sb : sa;
    } else if (sa.kind === 'file' && sb.kind === 'file') {
      parent = blobs[addDir(sa.name + ' + ' + sb.name, sa.tags.concat(sb.tags))];
      parent.x = sa.x; parent.y = sa.y;
      order.push(parent.id);
      child = null;
      sa.alive = false; sb.alive = false;
    } else {
      parent = sa.kind === 'dir' ? sa : sb;
      child = parent === sa ? sb : sa;
    }
    if (child) {
      child.parent = parent.id;
      parent.children.push(child.id);
      parent.mass += child.mass;
      child.alive = false;
    }
    pr.status = 'committed';
    setStatus('merged');
  }

  function renderPanel() {
    var pl = document.getElementById('pendingList');
    var bl = document.getElementById('blobList');
    var pid, pr, id, b, html;
    pl.innerHTML = '';
    for (pid in proposals) {
      pr = proposals[pid];
      if (pr.status !== 'pending') continue;
      html = document.createElement('div');
      html.className = 'pending';
      html.innerHTML = 'suggested: ' + blobs[pr.a].name + ' + ' + blobs[pr.b].name +
        '<div class="row"><button data-accept="' + pid + '">Accept</button><button data-refuse="' + pid + '">Refuse</button></div>';
      pl.appendChild(html);
    }
    bl.innerHTML = '';
    for (id in blobs) {
      b = blobs[id];
      if (!b.alive) continue;
      html = document.createElement('div');
      html.className = 'blob-row' + (id === selected ? ' selected' : '');
      html.innerHTML = '<div>' + b.name + '</div><div class="meta">' + b.kind + ' · ' + (b.mass / 1000000).toFixed(1) + ' MB</div>';
      html.setAttribute('data-id', id);
      bl.appendChild(html);
    }
  }

  canvas.addEventListener('pointerdown', function (e) {
    var rect = canvas.getBoundingClientRect();
    var mx = e.clientX - rect.left, my = e.clientY - rect.top;
    var id, b, r, hit = null;
    for (id in blobs) {
      b = blobs[id];
      if (!b.alive) continue;
      r = radius(b.mass);
      if ((mx - b.x) * (mx - b.x) + (my - b.y) * (my - b.y) <= r * r) hit = id;
    }
    selected = hit;
    if (hit) {
      dragging = hit;
      dragPos = { x: mx, y: my };
    }
    renderPanel(); draw();
  });
  canvas.addEventListener('pointermove', function (e) {
    var rect, mx, my, id, b, r, ro;
    if (!dragging) return;
    rect = canvas.getBoundingClientRect();
    mx = e.clientX - rect.left; my = e.clientY - rect.top;
    dragPos = { x: mx, y: my };
    b = blobs[dragging];
    r = radius(b.mass);
    for (id in blobs) {
      if (id === dragging || !blobs[id].alive) continue;
      ro = radius(blobs[id].mass);
      if ((mx - blobs[id].x) * (mx - blobs[id].x) + (my - blobs[id].y) * (my - blobs[id].y) <= (r + ro) * (r + ro)) {
        propose(dragging, id);
      }
    }
    renderPanel(); draw();
  });
  canvas.addEventListener('pointerup', function () {
    var pid, pr, same;
    if (!dragging) return;
    for (pid in proposals) {
      pr = proposals[pid];
      if (pr.status !== 'pending') continue;
      if (pr.a !== dragging && pr.b !== dragging) continue;
      same = blobs[pr.a].kind === blobs[pr.b].kind;
      if (same) commit(pid);
    }
    dragging = null; dragPos = null;
    renderPanel(); draw();
  });

  document.getElementById('pendingList').addEventListener('click', function (e) {
    var acc = e.target.getAttribute('data-accept');
    var ref = e.target.getAttribute('data-refuse');
    if (acc) { commit(acc); setStatus('accepted'); }
    if (ref && proposals[ref]) { proposals[ref].status = 'refused'; setStatus('refused'); }
    renderPanel(); draw();
  });
  document.getElementById('blobList').addEventListener('click', function (e) {
    var row = e.target.closest('[data-id]');
    if (!row) return;
    selected = row.getAttribute('data-id');
    renderPanel(); draw();
  });
  document.getElementById('btnNew').addEventListener('click', function () {
    var name = prompt('blob name');
    var id;
    if (!name) return;
    id = addFile(name, 100000, []);
    blobs[id].x = 120; blobs[id].y = 120;
    order.push(id);
    renderPanel(); draw();
  });
  document.getElementById('btnSplit').addEventListener('click', function () {
    var b, childId, child;
    if (!selected) { setStatus('select a folder first'); return; }
    b = blobs[selected];
    if (!b || b.children.length === 0) { setStatus('nothing to split'); return; }
    childId = b.children.pop();
    child = blobs[childId];
    b.mass -= child.mass;
    child.parent = null;
    child.alive = true;
    child.x = b.x + 50; child.y = b.y + 50;
    setStatus('split ' + child.name);
    renderPanel(); draw();
  });
  document.getElementById('btnSave').addEventListener('click', function () {
    var a = document.createElement('a');
    var blob = new Blob([JSON.stringify({ blobs: blobs, proposals: proposals }, null, 2)], { type: 'application/json' });
    a.href = URL.createObjectURL(blob);
    a.download = 'demo.orb.json';
    a.click();
    setStatus('saved demo.orb.json');
  });

  window.addEventListener('resize', function () { layout(); draw(); });
  layout();
  renderPanel();
  draw();
  setStatus('BlobFS 2D ready — ' + order.length + ' orbs');
})();
</script>
</body>
</html>
