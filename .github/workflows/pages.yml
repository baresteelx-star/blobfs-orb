name: pages

# Static demo: blobfs-2d.html at the site root, plus demo.orb beside it.
# The repository owner must set Settings → Pages → Build and deployment → Source
# to "GitHub Actions" before this workflow can publish. Pushing the workflow
# does not flip that setting.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the demo site
        run: |
          mkdir -p _site
          cp blobfs-2d.html _site/index.html
          cp blobfs-2d.html _site/blobfs-2d.html
          cp demo.orb _site/demo.orb
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
