[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "blobfs-orb"
version = "1.0.0"
description = "Python reference for the BlobFS .orb file format"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Kenneth Santala" }]
keywords = ["blobfs", "archive", "file-format"]
dependencies = []

[project.scripts]
orb = "orb:main"

[project.urls]
Homepage = "https://github.com/baresteelx-star/blobfs-orb"
Repository = "https://github.com/baresteelx-star/blobfs-orb"

[tool.setuptools.packages.find]
where = ["src"]
